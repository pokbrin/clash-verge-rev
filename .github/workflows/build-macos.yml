name: Build macOS (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Rust (1.95.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install deps + prebuild
        run: |
          pnpm i
          pnpm run prebuild aarch64-apple-darwin

      - name: Build (release)
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Collect & list build artifacts
        run: |
          mkdir -p artifacts
          echo "=== 查找产物（同时搜 target 与 src-tauri/target）==="
          find target src-tauri/target \( -name '*.dmg' -o -name '*.app' \) -print 2>/dev/null || true
          # 拷贝 .dmg（文件）
          find target src-tauri/target -type f -name '*.dmg' -exec cp {} artifacts/ \; 2>/dev/null || true
          # 拷贝 .app（目录 bundle）
          find target src-tauri/target -name '*.app' -exec cp -R {} artifacts/ \; 2>/dev/null || true
          echo "=== artifacts/ 内容 ==="
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-macos-aarch64
          path: artifacts/
